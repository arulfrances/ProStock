name: Keep Render service awake

# Render's free tier spins down after ~15 minutes of no traffic.
# This workflow pings the health endpoint often enough that it never idles.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 20 "${SERVICE_URL}/api/health" || echo "Ping failed (service may be waking up)."
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
